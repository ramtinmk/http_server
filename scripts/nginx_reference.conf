# nginx reference configuration for scripts/run_nginx_comparison.sh.
#
# The runner substitutes every @PLACEHOLDER@ before starting nginx. Four
# workers are pinned to the same CPU set as the server under test; three
# listeners exercise the corpus: identity (8082), precompressed gzip_static
# (8084), and TLS (8445). See docs/runbooks/compare-against-nginx.md.

worker_processes @WORKERS@;
worker_cpu_affinity @CPU_AFFINITY@;
pid @WORK@/nginx.pid;
error_log @WORK@/error.log warn;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include @NGINX_CONF_DIR@/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_requests 1000000;
    keepalive_timeout 75s;
    server_tokens off;
    reset_timedout_connection on;

    server {
        listen 127.0.0.1:@PORT_IDENTITY@ backlog=1024 reuseport;
        root @CORPUS_ROOT@;
        gzip off;
        location / { }
    }

    server {
        listen 127.0.0.1:@PORT_GZIP@ backlog=1024 reuseport;
        root @CORPUS_ROOT@;
        gzip off;
        gzip_static on;
        location / { }
    }

    server {
        listen 127.0.0.1:@PORT_TLS@ ssl backlog=1024 reuseport;
        root @CORPUS_ROOT@;
        ssl_certificate @CERT@;
        ssl_certificate_key @KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        gzip off;
        location / { }
    }
}
