# Installed default configuration for the hardened systemd unit.
#
# The unit invokes:  http_server --config /etc/http-server/http_server.conf
# and runs with WorkingDirectory=/usr/local/share/http-server so the built-in
# /home and /hello aliases resolve from the installed root/ assets.
#
# Precedence is defaults < this file < environment < command line. Edit this
# file and run `systemctl reload http-server` for safe tunables (log level and
# TLS certificate); every other key needs `systemctl restart http-server`.
# Full key reference: docs/env-vars.md and `http_server --help`.

port = 8081
document_root = /usr/local/share/http-server/root
index_files = index.html,index.htm

# Structured JSON logs. systemctl reload (SIGHUP) reopens this file, so
# logrotate can rotate it without a restart. The http-server user must be able
# to write it (LogsDirectory=/var/log/http-server in the unit handles that).
log_file = /var/log/http-server/http-server.log
log_level = info
access_log = 1

# Prometheus /metrics plus /healthz and /readyz on the data listeners. Firewall
# or bind these away from the public internet if the port is exposed.
observability = 1

# TLS termination is opt-in. Generate a certificate/key, place them under
# /etc/http-server/tls/, uncomment the three keys below, and reload. The key
# must not be world-accessible or startup fails.
tls = 0
tls_port = 8443
# tls_cert_file = /etc/http-server/tls/cert.pem
# tls_key_file = /etc/http-server/tls/key.pem
