# Installed as /etc/logrotate.d/http-server.
# Rotate the server's structured JSON log. The server reopens the file on
# SIGHUP, which `systemctl reload http-server` delivers, so no restart and no
# dropped connections.
/var/log/http-server/*.log {
    weekly
    rotate 8
    missingok
    notifempty
    compress
    delaycompress
    create 0640 http-server http-server
    sharedscripts
    postrotate
        systemctl reload http-server >/dev/null 2>&1 || true
    endscript
}
