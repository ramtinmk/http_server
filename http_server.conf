# Default runtime configuration for ./bin/http_server.
#
# This file is baked in at build time as DEFAULT_CONFIG_FILE (see
# CMakeLists.txt) and is loaded only when neither --config PATH nor
# HTTP_SERVER_CONFIG is given. Its values are the base layer: the environment
# and then command-line flags override them, in that order.
#
# Full key reference: docs/env-vars.md

# Serve every non-alias request path from the repository's root/ directory.
document_root = root

# Phase 3 TLS termination is opt-in. Set tls = 1 and point the paths at a real
# certificate/key to serve the same document root over HTTPS on tls_port. A
# relative path is resolved against the working directory.
tls = 0
tls_port = 8443
# tls_cert_file = tls/cert.pem
# tls_key_file = tls/key.pem

# Phase 5 observability is opt-in. When enabled, the Prometheus endpoint and
# the liveness/readiness probes are served on the data listeners. Keep these
# paths clear of real document-root assets and firewall them if the port is
# public.
observability = 0
# metrics_path = /metrics
# health_path = /healthz
# readiness_path = /readyz

# Mirror structured log records to syslog(3) in addition to log_file/stderr.
syslog = 0
